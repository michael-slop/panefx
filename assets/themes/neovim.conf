# color.mesh -> Neovim: which colorscheme each preset puts in nvim, Neovide and nvs-ide.
# Read by lua/plugins/zz-colormesh.lua in each editor config, on the laptop and (copied by
# sync-windows.sh) on pHub and sloppylaptopy.
#
#   id | colorscheme | plugin repo | lazy name (blank = default) | background (dark|light) | needs (repos, comma-separated)
#
# `house` means: leave each editor on its own deliberate scheme (tokyobones in nvim, necronomicon
# in nvs-ide). The rest follow Omarchy's own neovim.lua per theme, EXCEPT where the config already
# carries a plugin providing the same scheme under the same name -- two plugins both defining
# "everforest" or "monokai-pro" would fight -- so those use the installed one:
#   everforest  sainnhe/everforest        (Omarchy: neanias/everforest-nvim)
#   ristretto   loctvl842/monokai-pro      (Omarchy: gthelding/monokai-pro fork, filter "ristretto")
# The seven presets color.mesh generated (dracula .. night-owl) have no Omarchy neovim.lua; each
# uses that theme's standard Neovim port.

slop             | house
aether           | house
tokyo-night      | tokyonight-night       | folke/tokyonight.nvim         |            | dark
catppuccin       | catppuccin-mocha       | catppuccin/nvim               | catppuccin | dark
