# color.mesh presets — the ONE list of colour presets, shared by color.mesh (the
# desktop) and amtui (its own colour controller). Selection stays separate: each
# program picks its own theme; only the menu of choices is synced.
#
#   group | id | display name
#
# id is an Omarchy theme (~/.config/omarchy/themes/<id> or Omarchy's own themes);
# both programs read its colors.toml. Order here is the order in both menus.

