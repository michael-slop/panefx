[package]
name = "panefx"
version = "0.1.0"
edition = "2021"
description = "Animated backdrops pinned behind windows, following a tiling WM's layout"


[lib]
name = "panefx"
path = "src/lib.rs"

[[bin]]
name = "panefx"
path = "src/main.rs"

[[bin]]
name = "panefx-ctl"
path = "src/bin/panefx-ctl.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
ratatui = "0.29"
crossterm = "0.28"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  # Monitor enumeration for the desktop wallpaper. No new CRATES -- the windows
  # crate is already a dependency, so this costs two feature flags.
  "Win32_Devices_Display",
  # Process names, so a leftover WS_EX_LAYERED is only stripped from windows
  # belonging to a process panefx actually targets.
  "Win32_System_Diagnostics_ToolHelp",
  # System-tray icon. Shell_NotifyIconW lives here -- again NO new crates, the
  # windows crate is already a dependency.
  "Win32_UI_Shell",
  # Presenting the desktop wallpaper through DirectComposition. GDI leaves the
  # alpha channel at 0, and the raised desktop composites with alpha, so a
  # GDI-blitted wallpaper renders ADDITIVELY over Explorer's own background
  # instead of replacing it. See src/compositor.rs. Still NO new crates: the
  # windows crate is already here, this is five feature flags.
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_DirectComposition",
]

[profile.release]
opt-level = 3
lto = true
# LTO alone still leaves 16 codegen units for a binary; one unit lets the
# optimiser see the whole crate and inline across module boundaries. The grid
# loops in waves benefit most.
codegen-units = 1
# No unwinding tables. This is a background decoration -- if it panics it should
# die, not try to unwind through GDI handles.
panic = "abort"